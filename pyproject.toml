[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "literature-sourcing-agent"
version = "1.0.0"
description = "Autonomous academic literature sourcing agent using Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ── LLM Backends ──────────────────────────────────────────────────────────
    "openai>=1.54.0",              # Ollama uses the OpenAI-compatible local API
    "groq>=0.11.0",                # Groq cloud fallback (free tier)

    # ── HTTP & async ──────────────────────────────────────────────────────────
    "requests>=2.32.0",             # Sync HTTP for simple API calls
    "aiohttp>=3.10.0",             # Async HTTP for parallel database queries
    "httpx>=0.27.0",               # Alternative async client (Semantic Scholar)
    "tenacity>=9.0.0",             # Retry logic with backoff for rate limits

    # ── Browser automation (paywalled sources) ────────────────────────────────
    "playwright>=1.48.0",           # Chromium automation for WoS, Scopus, etc.

    # ── Academic database clients ─────────────────────────────────────────────
    "feedparser>=6.0.11",           # arXiv Atom feed parsing

    # ── Data Analysis ─────────────────────────────────────────────────────────
    "pandas>=2.2.0",               # Groupby operations in the analysis pipeline

    # ── Zotero integration ────────────────────────────────────────────────────
    "pyzotero>=1.5.18",             # Zotero Web API client
    "zotero-mcp-server>=0.3.0",     # MCP server for Zotero (Claude Code integration)

    # ── Data handling & deduplication ─────────────────────────────────────────
    "rapidfuzz>=3.10.0",            # Fast fuzzy string matching for title dedup
    "python-dateutil>=2.9.0",       # Robust date parsing across database formats

    # ── Output ────────────────────────────────────────────────────────────────
    "openpyxl>=3.1.5",             # Excel file generation with formatting
    "xlsxwriter>=3.2.0",           # Alternative Excel writer (richer chart support)

    # ── Config & environment ──────────────────────────────────────────────────
    "python-dotenv>=1.0.1",         # .env file loading
    "pyyaml>=6.0.2",               # YAML parsing for CONTEXT.md sections
    "tomllib>=2.0.1; python_version < '3.11'",  # TOML support (built-in 3.11+)

    # ── Logging ───────────────────────────────────────────────────────────────
    "loguru>=0.7.2",               # Structured logging to file + console

    # ── Data models ───────────────────────────────────────────────────────────
    "pydantic>=2.9.0",             # Runtime type validation for PaperRecord
]

[project.optional-dependencies]
dev = [
    # ── Testing ───────────────────────────────────────────────────────────────
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",       # async test support
    "pytest-cov>=6.0.0",           # coverage reporting
    "respx>=0.21.0",               # mock httpx requests in tests
    "responses>=0.25.0",           # mock requests in tests

    # ── Code quality ──────────────────────────────────────────────────────────
    "black>=24.10.0",              # formatter
    "ruff>=0.7.0",                 # linter
    "mypy>=1.13.0",               # type checker
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
source-papers = "src.sourcing_agent.main:cli"
run-analysis = "src.sourcing_agent.analysis.post_process:cli"

# ── Tool configuration ────────────────────────────────────────────────────────

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by black
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["sourcing_agent"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "integration: hits real external APIs — requires network access (may be slow)",
    "live: verified a real connection and returned data (not just a credential-gated skip)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/sourcing_agent"]
